has_animated_banner: false
dataset: []
technical_details:
  Source model: VietOCR vgg_transformer (pbcquoc/vietocr)
  Backbone: vgg19_bn CNN (AvgPool variant) + 1x1 last conv
  Vocabulary: 233 chars incl. full Vietnamese tone set
  Input resolution: 32 x 128 (H x W, fixed for NPU)
  Backbone parameters: 20.2M (53% of full model)
  NPU latency (S25 Ultra): 4.48 ms, 26/26 layers on NPU
