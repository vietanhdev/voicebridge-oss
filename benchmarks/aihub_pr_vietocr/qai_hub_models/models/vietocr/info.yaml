name: VietOCR
id: vietocr
status: pending
headline: Vietnamese text recognition (vgg19_bn + Transformer) — fills the AI Hub Vietnamese-OCR gap, runs 100% on Snapdragon NPU.
domain: Computer Vision
description: >
  VietOCR is a PyTorch OCR model for Vietnamese: a vgg19_bn CNN backbone feeding a
  Transformer seq2seq recognizer, with a 233-character vocabulary covering the full
  Vietnamese tone set (precomposed vowels such as ế ồ ự ấ ợ). It is the most widely
  used open Vietnamese recognizer, and Vietnamese OCR is currently absent from the AI
  Hub catalog. The recognition CNN backbone (53% of parameters) traces and compiles
  cleanly to the Snapdragon NPU.
use_case: Optical Character Recognition
tags:
